name: release

# 打 tag（v*）即发版：交叉编译 daemon、构建扩展、打包 skill，全部传到 Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
      - name: Go test (race)
        working-directory: daemon
        run: go test ./... -race -count=1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Extension tests
        working-directory: extension
        run: |
          npm ci --no-audit --no-fund
          npx vitest run

  daemon:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod

      - name: Build daemon
        working-directory: daemon
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w -X csi/daemon/internal/version.Version=${GITHUB_REF_NAME#v}" -o out/ ./cmd/csi

      - name: Package (tar.gz)
        if: matrix.goos != 'windows'
        run: |
          mkdir -p assets
          tar -C daemon/out -czf "assets/csi-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" csi

      - name: Package (zip)
        if: matrix.goos == 'windows'
        run: |
          mkdir -p assets
          cd daemon/out && zip "$OLDPWD/assets/csi-windows-amd64.zip" csi.exe

      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: assets/
          if-no-files-found: error

  extension:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Build extension
        working-directory: extension
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Package extension and skills
        run: |
          mkdir -p assets pkg
          cd extension/dist && zip -qr "$OLDPWD/assets/csi-extension.zip" . && cd "$OLDPWD"
          # 经暂存目录打包，保证归档根名与安装目标（~/.claude/skills/<name>）一致
          cp -r skills/csi pkg/csi
          cp -r skills/csi-e2e pkg/csi-e2e
          # PolyForm Notices：技能副本必须随附许可条款
          cp LICENSE pkg/csi/LICENSE
          cp LICENSE pkg/csi-e2e/LICENSE
          tar -C pkg -czf assets/csi-skill.tar.gz csi
          tar -C pkg -czf assets/csi-e2e-skill.tar.gz csi-e2e

      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: assets/
          if-no-files-found: error

  release:
    needs: [daemon, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: sha256sum *.tar.gz *.zip > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true

  # 发版后渲染 Formula 并推到 ximing/homebrew-csi（个人 tap，二进制 formula）。
  # 模板在 scripts/homebrew/csi.rb.tmpl；推送凭据用 secrets.TAP_GITHUB_TOKEN
  # （GITHUB_TOKEN 不能跨仓库写）。
  tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --pattern checksums.txt --dir dist --clobber

      - name: Render formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sha() { awk -v f="csi-$1.tar.gz" '$2==f {print $1}' dist/checksums.txt; }
          sed -e "s/@VERSION@/${version}/g" \
              -e "s/@SHA_DARWIN_ARM64@/$(sha darwin-arm64)/" \
              -e "s/@SHA_DARWIN_AMD64@/$(sha darwin-amd64)/" \
              -e "s/@SHA_LINUX_ARM64@/$(sha linux-arm64)/" \
              -e "s/@SHA_LINUX_AMD64@/$(sha linux-amd64)/" \
              scripts/homebrew/csi.rb.tmpl > Formula-csi.rb
          if grep -qE '@(VERSION|SHA_)' Formula-csi.rb; then
            echo "占位符未替换完，checksums.txt 里缺平台包？"; exit 1
          fi
          ruby -c Formula-csi.rb

      - name: Push to homebrew-csi
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/ximing/homebrew-csi.git" tap
          mkdir -p tap/Formula
          cp Formula-csi.rb tap/Formula/csi.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/csi.rb
          if git diff --cached --quiet; then
            echo "formula 无变化，跳过提交"
            exit 0
          fi
          git commit -m "csi ${TAG}"
          git push origin HEAD:main
