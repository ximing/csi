<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSI</title>
</head>
<body>
  <main id="popup">
    <header class="mast">
      <img class="mark" src="icons/icon.svg" width="28" height="28" alt="">
      <h1 id="title">CSI</h1>
    </header>

    <section class="status-band" aria-live="polite">
      <span id="status-dot" class="dot dot-off"></span>
      <span id="status-text">—</span>
    </section>

    <div class="url-field">
      <label id="server-url-label" for="server-url">Daemon WebSocket URL</label>
      <input id="server-url" type="text" spellcheck="false" autocomplete="off" placeholder="ws://127.0.0.1:10088/ws">
    </div>

    <div class="button-row">
      <button id="btn-connect" type="button">Connect</button>
      <button id="btn-disconnect" type="button">Disconnect</button>
      <button id="btn-test" type="button">Test Connection</button>
    </div>

    <p id="test-result" class="test-result"></p>

    <label class="switch">
      <input id="agent-independent-window" type="checkbox" disabled>
      <span class="switch-track" aria-hidden="true"></span>
      <span id="agent-independent-window-label"></span>
    </label>
    <p id="window-setting-error" class="test-result fail" role="alert" hidden></p>

    <a id="settings-link" class="settings-link" href="#"></a>

    <footer id="version-footer"></footer>
  </main>
  <script type="module" src="/src/popup/popup.ts"></script>
</body>
</html>
