<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- 圆角底板 -->
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>
  <!-- 放大镜：镜片 + 手柄 -->
  <circle cx="55" cy="55" r="27" fill="none" stroke="#ffffff" stroke-width="9"/>
  <line x1="75" y1="75" x2="99" y2="99" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <!-- 镜片里的眼睛（勘查/审视） -->
  <ellipse cx="55" cy="55" rx="15" ry="9.5" fill="#ffffff"/>
  <circle cx="55" cy="55" r="4.6" fill="#1d4ed8"/>
</svg>
