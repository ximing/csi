<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a63"/>
      <stop offset="1" stop-color="#16203a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#desk)"/>
  <!-- 键帽侧沿(厚度) -->
  <rect x="22" y="28" width="84" height="80" rx="14" fill="#05080f"/>
  <!-- 键帽顶面 -->
  <rect x="22" y="20" width="84" height="80" rx="14" fill="url(#face)" stroke="#64748b" stroke-width="1.5"/>
  <!-- 顶面高光 -->
  <rect x="28" y="24" width="72" height="9" rx="4.5" fill="#ffffff" opacity="0.10"/>
  <!-- CSI 刻字 -->
  <text x="56" y="66" font-family="Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">CSI</text>
  <!-- 终端光标 -->
  <rect x="76" y="72" width="16" height="5" rx="2.5" fill="#7dd3fc"/>
</svg>
