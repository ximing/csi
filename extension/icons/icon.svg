<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9dff"/>
      <stop offset="0.55" stop-color="#2f6bf0"/>
      <stop offset="1" stop-color="#1c3fb4"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8e6ff"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.42" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#5f9bfa"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </radialGradient>
  </defs>
  <!-- 圆角底板 -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#sheen)"/>
  <!-- 放大镜：手柄（带轻微暗影） -->
  <line x1="76.5" y1="79.5" x2="102" y2="105" stroke="#12339c" stroke-opacity="0.35" stroke-width="13" stroke-linecap="round"/>
  <line x1="75" y1="76.5" x2="101" y2="102.5" stroke="url(#ring)" stroke-width="12.5" stroke-linecap="round"/>
  <!-- 镜圈 + 镜片 -->
  <circle cx="54" cy="54" r="27.5" fill="#ffffff" fill-opacity="0.10" stroke="url(#ring)" stroke-width="9.5"/>
  <!-- 镜片高光 -->
  <path d="M 38.5 47 A 18 18 0 0 1 51 36.5" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
  <!-- 镜片里的眼睛（勘查/审视） -->
  <ellipse cx="54" cy="55" rx="16" ry="10.5" fill="#ffffff"/>
  <circle cx="54" cy="55" r="6.2" fill="url(#iris)"/>
  <circle cx="54" cy="55" r="2.8" fill="#101f5c"/>
  <circle cx="52.2" cy="53" r="1.4" fill="#ffffff" fill-opacity="0.9"/>
</svg>
