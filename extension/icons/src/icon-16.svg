<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9dff"/>
      <stop offset="1" stop-color="#1c3fb4"/>
    </linearGradient>
  </defs>
  <!-- 圆角底板 -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- 放大镜：最粗镜圈，纯白扁平 -->
  <line x1="74" y1="75" x2="100" y2="101" stroke="#ffffff" stroke-width="17" stroke-linecap="round"/>
  <circle cx="53" cy="53" r="26" fill="none" stroke="#ffffff" stroke-width="15"/>
  <!-- 极简眼睛：大眼白 + 大虹膜，保证 16px 可读 -->
  <ellipse cx="53" cy="54" rx="20" ry="13" fill="#ffffff"/>
  <circle cx="53" cy="54" r="10" fill="#1d4ed8"/>
  <circle cx="53" cy="54" r="4.5" fill="#12276b"/>
</svg>
