<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9dff"/>
      <stop offset="1" stop-color="#1c3fb4"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dce9ff"/>
    </linearGradient>
  </defs>
  <!-- 圆角底板 -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- 放大镜：更粗的镜圈与手柄 -->
  <line x1="75" y1="76.5" x2="101" y2="102.5" stroke="url(#ring)" stroke-width="14.5" stroke-linecap="round"/>
  <circle cx="54" cy="54" r="27" fill="#ffffff" fill-opacity="0.08" stroke="url(#ring)" stroke-width="12"/>
  <!-- 放大的眼睛：虹膜占比加大，省去高光弧 -->
  <ellipse cx="54" cy="55" rx="18" ry="12" fill="#ffffff"/>
  <circle cx="54" cy="55" r="8" fill="#1d4ed8"/>
  <circle cx="54" cy="55" r="3.6" fill="#12276b"/>
  <circle cx="52" cy="52.8" r="1.8" fill="#ffffff" fill-opacity="0.9"/>
</svg>
